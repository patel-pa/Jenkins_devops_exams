# Values for the fastapiapp chart (movie + cast microservices)

# Tag of the movie-service and cast-service images.
# Jenkins overrides it with the build number: --set imageTag=<n>
imageTag: latest

postgresImage: postgres:12.1-alpine
dbStorage: 1Gi

services:
  movie:
    image: patelpayal/movie-service
    replicaCount: 1
    db:
      name: movie_db_dev
      user: movie_db_username
      password: movie_db_password
    extraEnv:
      - name: CAST_SERVICE_HOST_URL
        value: http://cast-service:8000/api/v1/casts/
  cast:
    image: patelpayal/cast-service
    replicaCount: 1
    db:
      name: cast_db_dev
      user: cast_db_username
      password: cast_db_password
    extraEnv: []

nginx:
  image: nginx:stable-alpine
  # NodePorts are cluster-wide, so each namespace needs its own:
  # dev 30007, qa 30008, staging 30009, prod 30010 (set by Jenkins)
  nodePort: 30007
